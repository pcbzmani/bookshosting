backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "writings"
    label: "Writings & Articles (Medium Style)"
    folder: "content/writings"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields:
      - { label: "Article ID (e.g. poetry-2, essay-3)", name: "id", widget: "string", default: "essay-3" }
      - { label: "Category", name: "category", widget: "select", options: ["essays", "poetry", "notes"] }
      - { label: "Writing Language", name: "lang", widget: "select", options: ["en", "ta", "both"], default: "en" }
      - { label: "Title (English or தமிழ்)", name: "title_en", widget: "string" }
      - { label: "Optional Secondary Title (If Bilingual)", name: "title_ta", widget: "string", required: false }
      - { label: "Card Excerpt / Summary", name: "excerpt_en", widget: "text" }
      - { label: "Optional Secondary Excerpt", name: "excerpt_ta", widget: "text", required: false }
      - { label: "Reading Time (e.g., 4 min read)", name: "readTime_en", widget: "string", default: "4 min read" }
      - { label: "Publish Date", name: "date", widget: "string", default: "September 2026" }
      - { label: "Article / Poem Body (Rich Text / Medium Style)", name: "content_en", widget: "markdown" }
      - { label: "Optional Secondary Language Body", name: "content_ta", widget: "markdown", required: false }

  - name: "books"
    label: "Published Books"
    folder: "content/books"
    create: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    fields:
      - { label: "Book ID (e.g. book-3)", name: "id", widget: "string", default: "book-3" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Title (தமிழ்)", name: "title_ta", widget: "string", required: false }
      - { label: "Subtitle", name: "subtitle_en", widget: "string" }
      - { label: "Subtitle (தமிழ்)", name: "subtitle_ta", widget: "string", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Status Tag", name: "tag_en", widget: "string", default: "AVAILABLE ON AMAZON" }
      - { label: "Status Tag (தமிழ்)", name: "tag_ta", widget: "string", required: false }
      - { label: "Description", name: "description_en", widget: "text" }
      - { label: "Description (தமிழ்)", name: "description_ta", widget: "text", required: false }
      - { label: "Page Count", name: "pages", widget: "string", default: "200 Pages" }
      - { label: "ISBN", name: "isbn", widget: "string" }
      - { label: "Sample Text / Excerpt", name: "sampleText_en", widget: "text" }
      - { label: "Amazon Purchase Link", name: "amazonLink", widget: "string" }
